site_name: "PaletScan - Documentação Unificada do Ecossistema (ETL & PWA)"
site_description: "Documentação técnica e operacional completa do ecossistema PaletScan: pipelines de engenharia de dados (ETL), inteligência de catálogo B2B, IA de visão computacional e Progressive Web App (PWA) Local-First para controle de validades em câmaras frias."
site_author: "Jean Barbosa & Antigravity Data Engineering Team"
site_url: https://NaejBarbosa.github.io/paletscan-etl/

theme:
  name: material
  language: pt
  palette:
    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Alternar para modo escuro
    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Alternar para modo claro
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.expand
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight

markdown_extensions:
  - admonition
  - tables
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

nav:
  - "Ecossistema & Arquitetura":
      - "Visão Geral & Simbiose": "index.md"
      - "Arquitetura Ponta a Ponta": "arquitetura-ecossistema.md"
      - "Dev Móvel no Smartphone & Termux": "desenvolvimento-termux.md"
  - "Aplicação PWA Local-First":
      - "Visão Geral & Conceito PWA": "pwa-visao-geral.md"
      - "Service Worker & Resiliência Offline": "pwa-service-worker.md"
      - "Leitor Câmera & Regex Industrial": "pwa-scanner-regex.md"
      - "Endereçamento & Vagas de Câmaras": "pwa-vagas-zoneamento.md"
      - "Pesquisa, Consulta & Radar Watchlist": "pwa-pesquisa-watchlist.md"
      - "Relatórios, Conferência & Auditoria": "pwa-relatorios-auditoria.md"
      - "Autenticação, Passkeys & Permissões": "pwa-auth-permissoes.md"
  - "Engenharia de Dados (ETL & Pipeline)":
      - "Guia de Operações & CLI": "operacoes.md"
      - "Scrapers Multi-Fornecedores": "scrapers-multi-fornecedores.md"
      - "Pipeline Friboi / JBS": "pipeline-friboi.md"
      - "Normalizadores & Heurísticas": "heuristicas-normalizadores.md"
      - "Pipeline de IA de Imagens": "processamento-imagens.md"
      - "Governança de Schema & Manifesto": "schema-manifesto.md"
      - "Sincronização com Supabase": "supabase.md"
  - "Glossário & Referências": "glossario.md"
